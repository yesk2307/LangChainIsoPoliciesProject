[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "langchain-iso-policies"
version = "0.1.0"
description = "ISO Policies processing with LangChain"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "python-dotenv>=1.0.0",
    "langchain>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-google-genai>=2.0.0",
    "google-genai>=1.0.0",
    "chromadb>=1.5.0",
    "faiss-cpu>=1.13.0",
    "tiktoken>=0.14.0",
    "langchain-chroma>=0.2.0",
    "pypdf>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]
